<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuantOS — News</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav>
  <div class="logo"><span class="logo-text">Quant<span>OS</span></span></div>
  <div class="nav-tabs">
    <a href="index.html" class="nav-tab">Portfolio</a>
    <a href="screener.html" class="nav-tab">Screener</a>
    <a href="signals.html" class="nav-tab">Signals</a>
    <a href="news.html" class="nav-tab active">News</a>
    <a href="backtest.html" class="nav-tab">Backtest</a>
  </div>
  <div class="nav-right"><span id="statusText"></span></div>
</nav>

<div class="container">
  <div class="sub-tabs">
    <div class="sub-tab active" data-tab="ticker" onclick="switchSub('ticker')">Stock News <span class="badge" id="tickerCount">—</span></div>
    <div class="sub-tab" data-tab="headlines" onclick="switchSub('headlines')">Market Headlines <span class="badge" id="headlineCount">—</span></div>
    <div class="sub-tab" data-tab="actions" onclick="switchSub('actions')">Corporate Actions <span class="badge" id="actionCount">—</span></div>
  </div>

  <div class="sub-panel active" id="panel_ticker">
    <div id="tickerNews" class="empty-state">Loading...</div>
  </div>
  <div class="sub-panel" id="panel_headlines">
    <div id="marketHeadlines" class="empty-state">Loading...</div>
  </div>
  <div class="sub-panel" id="panel_actions">
    <div id="corpActions" class="empty-state">Loading...</div>
  </div>
</div>

<footer><div>QuantOS — Unified Trading & Investment Platform</div></footer>

<script>
const D='data';
async function fetchJ(f){try{const r=await fetch(`${D}/${f}?t=${Date.now()}`);return r.ok?await r.json():null;}catch{return null;}}
function switchSub(t){
  document.querySelectorAll('.sub-tab').forEach(s=>s.classList.toggle('active',s.dataset.tab===t));
  document.querySelectorAll('.sub-panel').forEach(p=>p.classList.toggle('active',p.id==='panel_'+t));
}
function ageLabel(h){if(h==null)return'';if(h<1)return`${Math.round(h*60)}m ago`;if(h<24)return`${Math.round(h)}h ago`;return`${Math.round(h/24)}d ago`;}

function renderTickerNews(data){
  const el=document.getElementById('tickerNews'), ct=document.getElementById('tickerCount');
  const news=data?.ticker_news||{};
  const syms=Object.keys(news);
  let total=0;
  if(!syms.length){el.innerHTML='<div class="empty-state">No stock news available. Run news digest.</div>';ct.textContent='0';return;}
  let html='';
  for(const s of syms){
    const items=news[s]; total+=items.length;
    html+=`<div class="card" style="padding:16px;margin-bottom:12px">
      <div class="section-label" style="color:var(--brand-light);margin-bottom:8px">
        <a href="https://www.tradingview.com/chart/?symbol=NSE%3A${s}" target="_blank" class="ticker-chip">${s} ↗</a>
      </div>`;
    for(const item of items){
      html+=`<div class="news-item">
        <a href="${item.link}" target="_blank" rel="noopener" class="news-link">${item.title}</a>
        <div class="news-meta">
          ${item.publisher?`<span class="news-source">${item.publisher}</span>`:''}
          <span>${ageLabel(item.age_h)}</span>
        </div>
      </div>`;
    }
    html+='</div>';
  }
  el.innerHTML=html; ct.textContent=total;
}

function renderHeadlines(data){
  const el=document.getElementById('marketHeadlines'), ct=document.getElementById('headlineCount');
  const h=data?.market_headlines||[];
  ct.textContent=h.length;
  if(!h.length){el.innerHTML='<div class="empty-state">No market headlines available.</div>';return;}
  el.innerHTML='<div class="card" style="padding:16px">'+h.map(item=>`<div class="news-item">
    <a href="${item.link}" target="_blank" rel="noopener" class="news-link">${item.title}</a>
    <div class="news-meta">
      <span class="news-source">${item.source}</span>
      <span>${ageLabel(item.age_h)}</span>
    </div>
    ${item.summary?`<div style="font-size:0.75rem;color:var(--text-dark);margin-top:3px">${item.summary}</div>`:''}
  </div>`).join('')+'</div>';
}

function renderCorpActions(data){
  const el=document.getElementById('corpActions'), ct=document.getElementById('actionCount');
  const events=data?.events||[];
  const upcoming=events.filter(e=>e.days_away>=-7);
  ct.textContent=upcoming.length;
  if(!upcoming.length){el.innerHTML='<div class="empty-state">No upcoming corporate actions.</div>';return;}

  const icons={dividend:'💰',split:'✂️',earnings_date:'📅','ex-dividend_date':'📅'};
  const colors={dividend:'var(--up-light)',split:'var(--brand-light)',earnings_date:'var(--yellow)','ex-dividend_date':'var(--yellow)'};

  el.innerHTML=upcoming.map(e=>{
    let cdCls='badge tag-neutral', cdTxt='';
    if(e.days_away===0){cdCls='badge tag-up';cdTxt='Today';}
    else if(e.days_away<0){cdCls='badge tag-neutral';cdTxt=`${Math.abs(e.days_away)}d ago`;}
    else if(e.days_away<=7){cdCls='badge tag-soon';cdTxt=`In ${e.days_away}d`;}
    else{cdTxt=`In ${e.days_away}d`;}
    const icon=icons[e.type]||'📅';
    const col=colors[e.type]||'var(--text-muted)';
    return `<div class="ca-card">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="ca-icon" style="color:${col}">${icon}</div>
        <div>
          <div class="ca-type" style="color:${col}">${e.type.replace(/_/g,' ')}</div>
          <div class="ca-symbol">${e.symbol}</div>
          <div class="ca-detail">${e.detail} · ${e.date}</div>
        </div>
      </div>
      <span class="${cdCls}">${cdTxt}</span>
    </div>`;
  }).join('');
}

async function load(){
  const [news,actions]=await Promise.all([fetchJ('news.json'),fetchJ('corporate_actions.json')]);
  const st=document.getElementById('statusText');
  if(news?.timestamp) st.textContent=`Last digest: ${new Date(news.timestamp).toLocaleString('en-IN')}`;
  else st.textContent='No news data. Run morning digest.';
  renderTickerNews(news);
  renderHeadlines(news);
  renderCorpActions(actions);
}
load();
</script>
</body>
</html>
