[project]
name = "quant-os"
version = "0.1.0"
description = "Personal Quant Operating System for Indian F&O markets"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "ta>=0.11",
    "yfinance>=0.2",
    "jugaad-data>=0.35",
    "mibian>=0.1.3",
    "duckdb>=1.0",
    "quantstats>=0.0.64",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.0",
    "pyarrow>=15.0",
    "loguru>=0.7",
    "kiteconnect>=5.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "requests>=2.31",
    "feedparser>=6.0",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "data", "indicators", "strategies", "backtester", "broker", "reports", "scripts", "notifications", "monitoring"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
