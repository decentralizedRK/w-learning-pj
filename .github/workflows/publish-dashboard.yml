name: Publish Dashboard

on:
  schedule:
    # Every 2 hours during IST market hours (9:00, 11:00, 13:00, 15:00 IST)
    - cron: "30 3,5,7,9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      QOS_KITE_API_KEY: ${{ secrets.QOS_KITE_API_KEY }}
      QOS_KITE_API_SECRET: ${{ secrets.QOS_KITE_API_SECRET }}
      QOS_KITE_ACCESS_TOKEN: ${{ secrets.QOS_KITE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - run: uv sync

      - name: Fetch dashboard data
        run: uv run python -m scripts.publish_dashboard_data --output dashboard/data
        continue-on-error: true

      - name: Deploy to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage dashboard files before orphan checkout wipes the tree
          mkdir -p /tmp/gh-deploy/data
          cp dashboard/index.html /tmp/gh-deploy/
          cp dashboard/backtest.html /tmp/gh-deploy/
          cp dashboard/screener.html /tmp/gh-deploy/
          cp dashboard/data/*.json /tmp/gh-deploy/data/ 2>/dev/null || true

          # Preserve existing gh-pages data
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          for f in backtest_results.json signals.json; do
            git show "gh-pages:data/$f" > "/tmp/gh-deploy/data/$f" 2>/dev/null || true
          done

          git checkout --orphan gh-pages-deploy
          git rm -rf . > /dev/null 2>&1 || true

          cp /tmp/gh-deploy/*.html .
          mkdir -p data
          cp /tmp/gh-deploy/data/*.json data/ 2>/dev/null || true

          git add -A
          git commit -m "chore: update dashboard data" || echo "No changes to commit"
          git push origin HEAD:gh-pages --force
