name: Publish Dashboard

on:
  schedule:
    # Every 15 min during IST market hours (9:15-15:30 IST = 3:45-10:00 UTC)
    - cron: "*/15 3-10 * * 1-5"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      QOS_KITE_API_KEY: ${{ secrets.QOS_KITE_API_KEY }}
      QOS_KITE_API_SECRET: ${{ secrets.QOS_KITE_API_SECRET }}
      QOS_KITE_ACCESS_TOKEN: ${{ secrets.QOS_KITE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - run: uv sync

      - name: Update P&L
        run: uv run python -m scripts.update_pnl --output dashboard/data/pnl.json
        continue-on-error: true

      - name: Check margins
        run: uv run python -m scripts.check_margins --output dashboard/data/margins.json
        continue-on-error: true

      - name: Fetch dashboard data
        run: uv run python -m scripts.publish_dashboard_data --output dashboard/data
        continue-on-error: true

      - name: Deploy to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Always use latest HTML from main
          mkdir -p /tmp/gh-deploy/data
          cp dashboard/index.html /tmp/gh-deploy/
          cp dashboard/backtest.html /tmp/gh-deploy/
          cp dashboard/screener.html /tmp/gh-deploy/
          cp dashboard/data/*.json /tmp/gh-deploy/data/ 2>/dev/null || true

          # Preserve data from gh-pages that wasn't freshly generated
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          for f in backtest_results.json signals.json pnl.json; do
            if [ ! -f "/tmp/gh-deploy/data/$f" ] || [ ! -s "/tmp/gh-deploy/data/$f" ]; then
              git show "gh-pages:data/$f" > "/tmp/gh-deploy/data/$f" 2>/dev/null || true
            fi
          done

          git checkout --orphan gh-pages-deploy
          git rm -rf . > /dev/null 2>&1 || true

          cp /tmp/gh-deploy/*.html .
          mkdir -p data
          cp /tmp/gh-deploy/data/*.json data/ 2>/dev/null || true

          git add -A
          git commit -m "chore: update dashboard data" || echo "No changes to commit"
          git push origin HEAD:gh-pages --force
