name: Run Backtest

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Symbol to backtest (ignored if multi=true)"
        default: "NIFTY"
      start:
        description: "Start date (YYYY-MM-DD)"
        default: "2020-01-01"
      end:
        description: "End date (YYYY-MM-DD)"
        default: "2025-12-31"
      capital:
        description: "Initial capital"
        default: "1000000"
      multi:
        description: "Multi-symbol universe backtest"
        type: boolean
        default: false
      universe:
        description: "Comma-separated symbols (multi mode only)"
        default: ""
      strategy:
        description: "Strategy YAML path"
        default: "config/strategies/momentum_futures_covered_call.yaml"

jobs:
  backtest:
    runs-on: ubuntu-latest
    env:
      INPUT_SYMBOL: ${{ inputs.symbol }}
      INPUT_START: ${{ inputs.start }}
      INPUT_END: ${{ inputs.end }}
      INPUT_CAPITAL: ${{ inputs.capital }}
      INPUT_MULTI: ${{ inputs.multi }}
      INPUT_UNIVERSE: ${{ inputs.universe }}
      INPUT_STRATEGY: ${{ inputs.strategy }}
      QOS_KITE_API_KEY: ${{ secrets.QOS_KITE_API_KEY }}
      QOS_KITE_API_SECRET: ${{ secrets.QOS_KITE_API_SECRET }}
      QOS_KITE_ACCESS_TOKEN: ${{ secrets.QOS_KITE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - run: uv sync

      - name: Build data
        run: |
          if [ "$INPUT_MULTI" = "true" ] && [ -n "$INPUT_UNIVERSE" ]; then
            uv run python -m scripts.build_backtest_db \
              --symbols "$INPUT_UNIVERSE" \
              --start "$INPUT_START" \
              --end "$INPUT_END" \
              --equity-only
          else
            uv run python -m scripts.build_backtest_db \
              --symbols "$INPUT_SYMBOL" \
              --start "$INPUT_START" \
              --end "$INPUT_END" \
              --equity-only
          fi

      - name: Run backtest
        run: |
          ARGS="--start $INPUT_START --end $INPUT_END --capital $INPUT_CAPITAL --strategy $INPUT_STRATEGY"
          if [ "$INPUT_MULTI" = "true" ]; then
            ARGS="$ARGS --multi"
            if [ -n "$INPUT_UNIVERSE" ]; then
              ARGS="$ARGS --universe $INPUT_UNIVERSE"
            fi
          else
            ARGS="$ARGS --symbol $INPUT_SYMBOL"
          fi
          mkdir -p dashboard/data
          uv run python -m scripts.run_backtest $ARGS --json-output dashboard/data/backtest_results.json

      - name: Upload tearsheet
        uses: actions/upload-artifact@v4
        with:
          name: backtest-tearsheet
          path: reports/output/*.html
          if-no-files-found: ignore

      - name: Commit results to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/backtest_results.json
          git diff --staged --quiet || git commit -m "chore: update backtest results"
          git pull --rebase origin main || true
          git push

  publish:
    needs: backtest
    uses: ./.github/workflows/publish-dashboard.yml
    secrets: inherit
