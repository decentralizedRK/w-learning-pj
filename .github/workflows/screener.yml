name: Daily Screener

permissions:
  contents: write

on:
  schedule:
    - cron: "0 12 * * 1-5"  # Mon-Fri 5:30pm IST (12:00 UTC)
  workflow_dispatch:
    inputs:
      top:
        description: "Number of top candidates to show"
        default: "10"
      universe:
        description: "Comma-separated symbols (default: full F&O universe)"
        default: ""

jobs:
  screen:
    outputs:
      completed: ${{ steps.done.outputs.completed }}

    runs-on: ubuntu-latest
    env:
      INPUT_TOP: ${{ inputs.top || '10' }}
      INPUT_UNIVERSE: ${{ inputs.universe }}
      QOS_KITE_API_KEY: ${{ secrets.QOS_KITE_API_KEY }}
      QOS_KITE_API_SECRET: ${{ secrets.QOS_KITE_API_SECRET }}
      QOS_KITE_ACCESS_TOKEN: ${{ secrets.QOS_KITE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - run: uv sync

      - name: Run screener
        run: |
          ARGS="--output signals.json --top $INPUT_TOP"
          if [ -n "$INPUT_UNIVERSE" ]; then
            ARGS="$ARGS --universe $INPUT_UNIVERSE"
          fi
          uv run python -m scripts.run_screener $ARGS

      - name: Upload signals
        uses: actions/upload-artifact@v4
        with:
          name: screener-signals-${{ github.run_number }}
          path: signals.json
          if-no-files-found: ignore

      - name: Publish screener to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Always use latest HTML from main
          mkdir -p /tmp/gh-deploy/data
          cp dashboard/index.html /tmp/gh-deploy/
          cp dashboard/backtest.html /tmp/gh-deploy/
          cp dashboard/screener.html /tmp/gh-deploy/

          # Preserve data JSON from gh-pages
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          for f in backtest_results.json indices.json positions.json trades.json stats.json margins.json; do
            git show "gh-pages:data/$f" > "/tmp/gh-deploy/data/$f" 2>/dev/null || true
          done

          # Add fresh screener data
          cp signals.json /tmp/gh-deploy/data/signals.json

          git checkout --orphan gh-pages-deploy
          git rm -rf . > /dev/null 2>&1 || true

          cp /tmp/gh-deploy/*.html .
          mkdir -p data
          cp /tmp/gh-deploy/data/*.json data/ 2>/dev/null || true

          git add -A
          git commit -m "chore: update screener results" || echo "No changes"
          git push origin HEAD:gh-pages --force

      - name: Mark complete
        id: done
        run: echo "completed=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: screen
    if: needs.screen.outputs.completed == 'true'
    uses: ./.github/workflows/publish-dashboard.yml
    secrets: inherit
