name: Daily Screener

permissions:
  contents: write

on:
  schedule:
    - cron: "0 12 * * 1-5"  # Mon-Fri 5:30pm IST (12:00 UTC)
  workflow_dispatch:
    inputs:
      top:
        description: "Number of top candidates to show"
        default: "20"
      universe:
        description: "Comma-separated symbols (default: full F&O universe)"
        default: ""

jobs:
  screen:
    runs-on: ubuntu-latest
    env:
      INPUT_TOP: ${{ inputs.top || '20' }}
      INPUT_UNIVERSE: ${{ inputs.universe }}
      QOS_KITE_API_KEY: ${{ secrets.QOS_KITE_API_KEY }}
      QOS_KITE_API_SECRET: ${{ secrets.QOS_KITE_API_SECRET }}
      QOS_KITE_ACCESS_TOKEN: ${{ secrets.QOS_KITE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - run: uv sync

      - name: Run screener
        run: |
          ARGS="--output dashboard/data/signals.json --top $INPUT_TOP"
          if [ -n "$INPUT_UNIVERSE" ]; then
            ARGS="$ARGS --universe $INPUT_UNIVERSE"
          fi
          uv run python -m scripts.run_screener $ARGS

      - name: Generate recommendations
        run: uv run python -m scripts.generate_recommendations --signals dashboard/data/signals.json --output dashboard/data/recommendations.json
        env:
          QOS_TELEGRAM_BOT_TOKEN: ${{ secrets.QOS_TELEGRAM_BOT_TOKEN }}
          QOS_TELEGRAM_CHAT_ID: ${{ secrets.QOS_TELEGRAM_CHAT_ID }}

      - name: Commit signals + recommendations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/signals.json dashboard/data/recommendations.json
          git diff --staged --quiet || git commit -m "chore: update screener signals and recommendations"
          git pull --rebase origin main || true
          git push

      - name: Upload signals
        uses: actions/upload-artifact@v4
        with:
          name: screener-signals-${{ github.run_number }}
          path: dashboard/data/signals.json
          if-no-files-found: ignore

  publish:
    needs: screen
    uses: ./.github/workflows/publish-dashboard.yml
    secrets: inherit
