name: Update F&O Segments

on:
  schedule:
    - cron: "0 12 * * 0"  # Sunday 5:30pm IST (12:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - run: uv sync

      - name: Update segment lists from NSE
        run: uv run python -m scripts.update_fo_segments

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/fo_segments.py
          git diff --staged --quiet || git commit -m "chore: update F&O segment lists from NSE"
          git push
