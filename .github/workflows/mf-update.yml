name: MF Update

permissions:
  contents: write

on:
  schedule:
    - cron: "0 15 * * 1-5"  # Mon-Fri 8:30 PM IST (15:00 UTC)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      QOS_TELEGRAM_BOT_TOKEN: ${{ secrets.QOS_TELEGRAM_BOT_TOKEN }}
      QOS_TELEGRAM_CHAT_ID: ${{ secrets.QOS_TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - run: uv sync

      - name: Update MF NAVs
        run: uv run python -m scripts.mf_update --output dashboard/data/mf_snapshot.json

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/mf_snapshot.json config/mf_portfolio.json
          git diff --staged --quiet || git commit -m "chore: MF NAV update"
          git pull --rebase origin main || true
          git push

  publish:
    needs: update
    uses: ./.github/workflows/publish-dashboard.yml
    secrets: inherit
