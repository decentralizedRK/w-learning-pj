name: Morning Digest

permissions:
  contents: write

on:
  schedule:
    - cron: "30 2 * * 1-5"  # Mon-Fri 8:00 AM IST (2:30 UTC)
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - run: uv sync

      - name: News digest
        run: uv run python -m scripts.news_digest --output dashboard/data/news.json
        env:
          QOS_TELEGRAM_BOT_TOKEN: ${{ secrets.QOS_TELEGRAM_BOT_TOKEN }}
          QOS_TELEGRAM_CHAT_ID: ${{ secrets.QOS_TELEGRAM_CHAT_ID }}

      - name: Corporate actions
        run: uv run python -m scripts.corporate_actions --output dashboard/data/corporate_actions.json
        env:
          QOS_TELEGRAM_BOT_TOKEN: ${{ secrets.QOS_TELEGRAM_BOT_TOKEN }}
          QOS_TELEGRAM_CHAT_ID: ${{ secrets.QOS_TELEGRAM_CHAT_ID }}

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/news.json dashboard/data/corporate_actions.json
          git diff --staged --quiet || git commit -m "chore: morning news digest"
          git push

  publish:
    needs: digest
    uses: ./.github/workflows/publish-dashboard.yml
    secrets: inherit
